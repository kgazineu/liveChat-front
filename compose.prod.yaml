name: live-chat-front

services:
  frontend:
    image: ghcr.io/kgazineu/livechat-front:${APP_VERSION:-latest}
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:?defina API_URL no arquivo .env}
      BROKER_URL: ${BROKER_URL:?defina BROKER_URL no arquivo .env}
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
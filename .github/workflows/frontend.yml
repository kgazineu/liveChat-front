name: Frontend

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Compilar aplicação
        run: npm run build

  publish:
    name: Publicar imagem
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kgazineu/livechat-front:${{ github.sha }}
            ghcr.io/kgazineu/livechat-front:latest

  deploy:
    name: Deploy no homelab
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - publish
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 10

    steps:
      - name: Atualizar frontend
        run: |
          cd /opt/livechat-front
          docker compose pull frontend
          docker compose up -d --wait --wait-timeout 120 frontend
          docker compose ps
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/health